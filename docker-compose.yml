version: '3.8'

services:
  voice-receptionist:
    image: ${DOCKERHUB_USERNAME:-nicolasmd}/alarmtronics-receptionist:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alarmtronics-receptionist
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
