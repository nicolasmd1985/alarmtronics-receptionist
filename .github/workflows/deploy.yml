name: Build, Push, and Deploy Alarmtronics AI Receptionist

on:
  push:
    branches:
      - main

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/alarmtronics-receptionist:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/alarmtronics-receptionist:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env file from GitHub Secrets
        run: |
          cat > .env.production << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_LIVE_MODEL=${{ secrets.GEMINI_LIVE_MODEL || 'gemini-3.1-flash-live-preview' }}
          GEMINI_VOICE=${{ secrets.GEMINI_VOICE || 'Aoede' }}
          HOST=0.0.0.0
          PORT=8000
          PUBLIC_DOMAIN=${{ secrets.PUBLIC_DOMAIN || 'voz.nicolasmahecha.com' }}
          COMPANY_NAME=${{ secrets.COMPANY_NAME || 'Alarmtronics' }}
          OWNER_NAME=${{ secrets.OWNER_NAME || 'Alarmtronics' }}
          DEFAULT_LANGUAGE=en
          TELNYX_PHONE_NUMBER=${{ secrets.TELNYX_PHONE_NUMBER || '+14073050475' }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Create deploy script
        run: |
          cat > deploy_script.sh << 'EOF'
          #!/bin/bash
          set -e

          cd "$(dirname "$0")"
          echo "Starting Alarmtronics Voice Receptionist deployment..."

          # Pull the latest Docker image
          echo "Pulling latest Docker image from Docker Hub..."
          docker compose pull

          # Start or update the container
          echo "Starting voice-receptionist container in detached mode..."
          docker compose up -d --remove-orphans

          # Wait for container startup and healthcheck
          echo "Waiting for healthcheck to pass..."
          sleep 5

          # Verify container status
          if ! docker compose ps voice-receptionist | grep -q "Up"; then
            echo "Error: Voice receptionist container failed to start"
            docker compose logs --tail=50 voice-receptionist
            exit 1
          fi

          # Prune obsolete images
          echo "Pruning dangling images..."
          docker image prune -f

          echo "Deployment completed successfully! Voice Receptionist is running 24/7."
          EOF
          chmod +x deploy_script.sh

      - name: Ensure deploy directory exists on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'mkdir -p ~/alarmtronics-receptionist/data && chmod 755 ~/alarmtronics-receptionist'

      - name: Copy files to production server
        run: |
          scp -o StrictHostKeyChecking=no .env.production ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/alarmtronics-receptionist/.env
          scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/alarmtronics-receptionist/docker-compose.yml
          scp -o StrictHostKeyChecking=no deploy_script.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/alarmtronics-receptionist/deploy_script.sh
          scp -o StrictHostKeyChecking=no data/greeting.ulaw ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/alarmtronics-receptionist/data/greeting.ulaw

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/alarmtronics-receptionist
            chmod +x deploy_script.sh
            ./deploy_script.sh

      - name: Verify live service health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/alarmtronics-receptionist
            docker compose ps
            echo "Checking health endpoint with retry loop..."
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
                echo "Healthcheck passed on attempt $i!"
                break
              fi
              echo "Waiting for container initialization... ($i/30)"
              sleep 2
            done
            curl -s -f http://127.0.0.1:8000/health || exit 1
            echo ""
            echo "Recent container logs:"
            docker compose logs --tail=20 voice-receptionist
