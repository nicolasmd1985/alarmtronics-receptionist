[project]
name = "phones-alarmtronics-receptionist"
version = "1.0.0"
description = "Real-time AI Inbound Voice Receptionist Integration for Telnyx with Gemini and Piper TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "google-genai>=1.0.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
